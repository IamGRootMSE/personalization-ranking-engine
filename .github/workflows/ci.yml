name: Verify research and static site
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
      - run: node --test tests/scorer.test.mjs
      - name: Real-data smoke train and evaluate
        run: python -m ranking.run --config configs/smoke.json --output reports/smoke --artifacts artifacts/smoke
      - run: python scripts/build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: dist
          include-hidden-files: true
