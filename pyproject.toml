[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personalization-ranking-engine"
version = "1.0.0"
description = "Reproducible temporal recommendation benchmark and private browser inference"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "torch==2.8.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
